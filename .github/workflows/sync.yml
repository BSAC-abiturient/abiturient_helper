name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # Шаг очистки: удаляет тяжелые картинки фронтенда перед пушем на Hugging Face
      - name: Clean frontend binaries for Hugging Face
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          # Исключаем папки с изображениями и веб-страницами из отправки на бэкенд
          git rm -r --ignore-unmatch Fon Fon_2 SSO VO_11 VO_SSO pages || true
          git commit -m "Remove frontend binaries for HF deployment" || echo "No changes to commit"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://narxselune:$HF_TOKEN@huggingface.co/spaces/narxselune/bsac-backend master:main