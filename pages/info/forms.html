<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {
            console.warn(e);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../Fon/avatar.jpeg" type="image/jpeg">
    <title>Бланки и заявления — БГАС</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="container">
        <header style="text-align: left; border: none; padding: 0;">
            <a href="../../index.html" class="btn-back">← Назад</a>
        </header>
        <main style="margin-top: 20px;">
            <h1 class="spec-title" style="font-size: 32px; margin-bottom: 5px;">Бланки и заявления</h1>
            <p class="info-line" style="margin-bottom: 25px; opacity: 0.8;">Официальные бланки заявлений, договоров и образцы документов БГАС</p>

            <div id="forms-list" class="route-container">
                <div class="academy-loader-container">
                    <div class="cap-wrapper">
                        <svg class="mortarboard-svg" viewBox="0 0 64 64">
                            <path d="M16 32 V38 C16 43 23 46 32 46 C41 46 48 43 48 38 V32" fill="none" stroke="#007bff" stroke-width="3" stroke-linecap="round" />
                            <polygon points="32,10 58,22 32,34 6,22" fill="#007bff" stroke="#007bff" stroke-width="1" />
                            <path class="cap-tassel" d="M32,22 L46,27 V37" fill="none" stroke="#ff9800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="32" cy="22" r="2" fill="#ffffff" />
                        </svg>
                    </div>
                    <div class="loader-text">Загрузка данных...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const STRAPI_URL = 'https://narxselune-bsac-backend.hf.space';

        // Универсальный безопасный извлекатель ссылок с защитой от скачивания офисных документов
        function getStrapiFileUrl(item, strapiUrl) {
            const fileFields = ['file', 'document', 'attachment', 'upload', 'doc'];
            let rawUrl = null;

            for (const field of fileFields) {
                const media = item[field];
                if (!media) continue;

                if (media.data && media.data.attributes && media.data.attributes.url) {
                    rawUrl = strapiUrl + media.data.attributes.url;
                    break;
                }

                if (media.data && Array.isArray(media.data) && media.data.length > 0) {
                    const firstFile = media.data[0].attributes || media.data[0];
                    if (firstFile.url) {
                        rawUrl = strapiUrl + firstFile.url;
                        break;
                    }
                }

                if (media.url) {
                    rawUrl = strapiUrl + media.url;
                    break;
                }

                if (Array.isArray(media) && media.length > 0 && media[0].url) {
                    rawUrl = strapiUrl + media[0].url;
                    break;
                }
            }

            if (!rawUrl) return null;

            const lowerUrl = rawUrl.toLowerCase();
            const isOfficeDocument = lowerUrl.endsWith('.doc') ||
                lowerUrl.endsWith('.docx') ||
                lowerUrl.endsWith('.xls') ||
                lowerUrl.endsWith('.xlsx');

            if (isOfficeDocument) {
                // Если файл Word/Excel — открываем его через онлайн-просмотрщик Google в браузере
                return 'https://docs.google.com/viewer?url=' + encodeURIComponent(rawUrl);
            }

            return rawUrl; // PDF и картинки открываем напрямую
        }

        async function loadDocuments() {
            try {
                const response = await fetch(`${STRAPI_URL}/api/documents?populate=*`);
                const result = await response.json();
                const documents = result.data || [];
                const container = document.getElementById('forms-list');
                container.innerHTML = '';

                if (documents.length === 0) {
                    container.innerHTML = '<div class="no-paid-msg">Документы временно отсутствуют</div>';
                    return;
                }

                // Объект для группировки документов по уровням
                const groupedData = {
                    sso: {
                        title: "Среднее специальное образование",
                        docs: []
                    },
                    vo: {
                        title: "Высшее образование",
                        docs: []
                    }
                };

                // Сканируем названия документов и распределяем по группам
                documents.forEach(doc => {
                    const item = doc.attributes || doc;
                    const titleLower = item.title.toLowerCase();
                    const fileUrl = getStrapiFileUrl(item, STRAPI_URL);

                    const docPayload = {
                        title: item.title,
                        url: fileUrl,
                        subtitle: item.subtitle,
                        direct_url: item.direct_url // Сохраняем прямое поле ссылки
                    };

                    if (titleLower.includes('высш') || titleLower.includes(' во') || titleLower.includes('академ')) {
                        groupedData.vo.docs.push(docPayload);
                    } else {
                        groupedData.sso.docs.push(docPayload);
                    }
                });

                const groupKeys = ['sso', 'vo'];

                groupKeys.forEach(key => {
                    const group = groupedData[key];
                    if (group.docs.length === 0) return;

                    // Создаем стильный заголовок группы документов с синей полосой слева
                    const groupTitleEl = document.createElement('h2');
                    groupTitleEl.className = 'section-title';
                    groupTitleEl.style.fontSize = '20px';
                    groupTitleEl.style.fontWeight = '800';
                    groupTitleEl.style.color = '#007bff';
                    groupTitleEl.style.marginTop = '35px';
                    groupTitleEl.style.marginBottom = '15px';
                    groupTitleEl.style.borderLeft = '4px solid #007bff';
                    groupTitleEl.style.paddingLeft = '12px';
                    groupTitleEl.innerText = group.title;
                    container.appendChild(groupTitleEl);

                    // Создаем контейнер-карточку для списка кнопок этой группы
                    const card = document.createElement('div');
                    card.className = 'route-card';
                    card.style.padding = '18px 20px';

                    let innerHtml = '';
                    group.docs.forEach((doc, idx) => {
                        const isLastItem = idx === group.docs.length - 1;

                        // ОПРЕДЕЛЕНИЕ ССЫЛКИ: Сначала проверяем direct_url на Vercel, затем fileUrl из Strapi
                        const finalUrl = doc.direct_url ? `../../..${doc.direct_url}` : doc.url;

                        let actionButtonHtml = '';
                        if (finalUrl) {
                            // Убрали атрибут download, чтобы браузер открывал документ на просмотр в новой вкладке
                            actionButtonHtml = `<a href="${finalUrl}" target="_blank" rel="noopener noreferrer" class="btn-arrow" style="font-size: 12px; text-decoration: none;">Просмотр</a>`;
                        } else {
                            actionButtonHtml = `<button onclick="alert('Файл бланка еще не прикреплен в панели управления Strapi.')" class="btn-arrow btn-gray" style="font-size: 12px; cursor: pointer; border: none; padding: 8px 12px; white-space: nowrap;">Нет файла</button>`;
                        }

                        // Формируем HTML-код подзаголовка, если он заполнен в админке Strapi
                        let subtitleHtml = '';
                        if (doc.subtitle) {
                            subtitleHtml = `<br><span style="font-size: 11.5px; opacity: 0.75; font-weight: normal; display: inline-block; margin-top: 4px; color: inherit; line-height: 1.4;">${doc.subtitle}</span>`;
                        }

                        innerHtml += `
                            <div class="route-detail" style="font-size: 14.5px; margin-bottom: ${isLastItem ? '0' : '15px'}; border-bottom: ${isLastItem ? 'none' : '1px dashed rgba(113, 128, 150, 0.15)'}; padding-bottom: ${isLastItem ? '0' : '10px'}; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                <span style="font-weight: bold; flex: 1; padding-right: 15px; text-align: left;">
                                    📄 ${doc.title} ${subtitleHtml}
                                </span>
                                ${actionButtonHtml}
                            </div>
                        `;
                    });

                    card.innerHTML = innerHtml;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Ошибка загрузки документов:", error);
                document.getElementById('forms-list').innerHTML = '<div class="no-paid-msg">Не удалось загрузить бланки.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadDocuments);
    </script>
    <script src="../../pages/monitoring/monitoring.js"></script>
</body>
</html>
