<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {
            console.warn(e);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../Fon/avatar.jpeg" type="image/jpeg">
    <title>Списки зачисленных — БГАС</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="container">
        <header style="text-align: left; border: none; padding: 0;">
            <a href="../../index.html" class="btn-back">← Назад</a>
        </header>
        <main style="margin-top: 20px;">
            <h1 class="spec-title" style="font-size: 32px; margin-bottom: 5px;">Списки зачисленных</h1>
            <p class="info-line" style="margin-bottom: 25px; opacity: 0.8;">Официальные утвержденные списки зачисления абитуриентов БГАС</p>

            <div id="enrolled-container" class="route-container">
                <div class="academy-loader-container">
                    <div class="cap-wrapper">
                        <svg class="mortarboard-svg" viewBox="0 0 64 64">
                            <path d="M16 32 V38 C16 43 23 46 32 46 C41 46 48 43 48 38 V32" fill="none" stroke="#007bff" stroke-width="3" stroke-linecap="round" />
                            <polygon points="32,10 58,22 32,34 6,22" fill="#007bff" stroke="#007bff" stroke-width="1" />
                            <path class="cap-tassel" d="M32,22 L46,27 V37" fill="none" stroke="#ff9800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="32" cy="22" r="2" fill="#ffffff" />
                        </svg>
                    </div>
                    <div class="loader-text">Загрузка данных...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const STRAPI_URL = 'https://narxselune-bsac-backend.hf.space';

        function getStrapiFileUrl(item, strapiUrl) {
            const fileFields = ['file', 'document', 'attachment', 'upload', 'doc'];

            for (const field of fileFields) {
                const media = item[field];
                if (!media) continue;

                if (media.data && media.data.attributes && media.data.attributes.url) {
                    return strapiUrl + media.data.attributes.url;
                }

                if (media.data && Array.isArray(media.data) && media.data.length > 0) {
                    const firstFile = media.data[0].attributes || media.data[0];
                    if (firstFile.url) return strapiUrl + firstFile.url;
                }

                if (media.url) {
                    return strapiUrl + media.url;
                }

                if (Array.isArray(media) && media.length > 0 && media[0].url) {
                    return strapiUrl + media[0].url;
                }
            }
            return null;
        }

        async function loadEnrolledLists() {
            try {
                const response = await fetch(`${STRAPI_URL}/api/lists-of-enrolleds?populate=*`);
                const result = await response.json();
                const lists = result.data || [];
                const container = document.getElementById('enrolled-container');
                container.innerHTML = '';

                if (lists.length === 0) {
                    container.innerHTML = '<div class="no-paid-msg">Списки в данный момент отсутствуют</div>';
                    return;
                }

                // Иерархическая структура данных согласно вашему запросу
                const groupedData = {
                    vo: {
                        title: "Общее высшее образование (ВО)",
                        independentDocs: [], // Массив для 2-го высшего без подписи
                        sub: {
                            vo_11: { title: "На базе 11 классов", docs: [] },
                            vo_sso_dnev: { title: "На базе ССО (Дневная форма обучения)", docs: [] },
                            vo_sso_zaoch: { title: "На базе ССО (Заочная форма обучения)", docs: [] }
                        }
                    },
                    sso: {
                        title: "Среднее специальное образование (ССО)",
                        independentDocs: [],
                        sub: {
                            sso_9: { title: "На базе 9 классов", docs: [] },
                            sso_11_dnev: { title: "На базе 11 классов (Дневная форма обучения)", docs: [] },
                            sso_11_zaoch: { title: "На базе 11 классов (Заочная форма обучения)", docs: [] },
                            sso_pto: { title: "На базе ПТО", docs: [] }
                        }
                    }
                };

                lists.forEach(list => {
                    const item = list.attributes || list;
                    const titleLower = item.title.toLowerCase();

                    // Выносим 2-ое высшее отдельно
                    if (titleLower.includes('2-ое') || titleLower.includes('второе') || titleLower.includes('2ое')) {
                        groupedData.vo.independentDocs.push(item);
                    }
                    // Распределяем в иерархию по ключевым словам в названиях
                    else if (titleLower.includes('высш') || titleLower.includes(' во') || titleLower.includes('академ')) {
                        if (titleLower.includes('базе ссо') || titleLower.includes(' ссо')) {
                            if (titleLower.includes('заоч')) {
                                groupedData.vo.sub.vo_sso_zaoch.docs.push(item);
                            } else {
                                groupedData.vo.sub.vo_sso_dnev.docs.push(item);
                            }
                        } else {
                            groupedData.vo.sub.vo_11.docs.push(item);
                        }
                    } else {
                        if (titleLower.includes('9 кл') || titleLower.includes(' 9 ')) {
                            groupedData.sso.sub.sso_9.docs.push(item);
                        } else if (titleLower.includes('пто')) {
                            groupedData.sso.sub.sso_pto.docs.push(item);
                        } else {
                            if (titleLower.includes('заоч')) {
                                groupedData.sso.sub.sso_11_zaoch.docs.push(item);
                            } else {
                                groupedData.sso.sub.sso_11_dnev.docs.push(item);
                            }
                        }
                    }
                });

                const mainKeys = ['vo', 'sso'];
                mainKeys.forEach(mainKey => {
                    const mainGroup = groupedData[mainKey];

                    // Проверка наличия документов в группе (с учетом независимых документов)
                    const hasAnyDocs = Object.values(mainGroup.sub).some(sub => sub.docs.length > 0) ||
                        (mainGroup.independentDocs && mainGroup.independentDocs.length > 0);
                    if (!hasAnyDocs) return;

                    // Большой заголовок (ВО или ССО) с синей линией слева
                    const mainTitleEl = document.createElement('h2');
                    mainTitleEl.className = 'section-title';
                    mainTitleEl.style.fontSize = '21px';
                    mainTitleEl.style.fontWeight = '800';
                    mainTitleEl.style.color = '#007bff';
                    mainTitleEl.style.marginTop = '35px';
                    mainTitleEl.style.marginBottom = '15px';
                    mainTitleEl.style.borderLeft = '4px solid #007bff';
                    mainTitleEl.style.paddingLeft = '12px';
                    mainTitleEl.innerText = mainGroup.title;
                    container.appendChild(mainTitleEl);

                    // СНАЧАЛА ОТРИСОВЫВАЕМ НЕЗАВИСИМЫЕ ДОКУМЕНТЫ (например, 2-ое высшее) без подписей
                    if (mainGroup.independentDocs && mainGroup.independentDocs.length > 0) {
                        const card = document.createElement('div');
                        card.className = 'route-card';
                        card.style.padding = '15px 20px';
                        card.style.marginTop = '10px';
                        card.style.marginBottom = '15px';

                        let innerHtml = '';
                        mainGroup.independentDocs.forEach((doc, idx) => {
                            const isLastItem = idx === mainGroup.independentDocs.length - 1;
                            const fileUrl = doc.direct_url ? `../../..${doc.direct_url}` : getStrapiFileUrl(doc, STRAPI_URL);

                            let actionButtonHtml = '';
                            if (fileUrl) {
                                actionButtonHtml = `<a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="btn-arrow" style="font-size: 12px; text-decoration: none;">Просмотр</a>`;
                            } else {
                                actionButtonHtml = `<button onclick="alert('Файл еще не прикреплен.')" class="btn-arrow btn-gray" style="font-size: 12px; cursor: pointer; border: none; padding: 8px 12px;">Нет файла</button>`;
                            }

                            innerHtml += `
                                    <div class="route-detail" style="font-size: 14px; margin-bottom: ${isLastItem ? '0' : '12px'}; border-bottom: ${isLastItem ? 'none' : '1px dashed rgba(113, 128, 150, 0.15)'}; padding-bottom: ${isLastItem ? '0' : '8px'}; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                        <span style="font-weight: bold; flex: 1; padding-right: 15px; text-align: left;">
                                            📋 ${doc.title}
                                        </span>
                                        ${actionButtonHtml}
                                    </div>
                                `;
                        });

                        card.innerHTML = innerHtml;
                        container.appendChild(card);
                    }

                    // ЗАТЕМ ОТРИСОВЫВАЕМ ВСЕ ПОДРАЗДЕЛЫ (на базе 11, на базе ССО дневная/заочная)
                    Object.keys(mainGroup.sub).forEach(subKey => {
                        const subGroup = mainGroup.sub[subKey];
                        if (subGroup.docs.length === 0) return;

                        // Маленький заголовок подраздела (например, "• На базе 11 классов")
                        const subTitleEl = document.createElement('h3');
                        subTitleEl.style.fontSize = '14px';
                        subTitleEl.style.fontWeight = '700';
                        subTitleEl.style.color = 'inherit';
                        subTitleEl.style.marginTop = '15px';
                        subTitleEl.style.marginBottom = '8px';
                        subTitleEl.style.opacity = '0.85';
                        subTitleEl.innerText = '• ' + subGroup.title;
                        container.appendChild(subTitleEl);

                        // Карточка-контейнер для списка файлов этого подраздела
                        const card = document.createElement('div');
                        card.className = 'route-card';
                        card.style.padding = '15px 20px';
                        card.style.marginBottom = '15px';

                        let innerHtml = '';
                        subGroup.docs.forEach((doc, idx) => {
                            const isLastItem = idx === subGroup.docs.length - 1;
                            const fileUrl = doc.direct_url ? `../../..${doc.direct_url}` : getStrapiFileUrl(doc, STRAPI_URL);

                            let actionButtonHtml = '';
                            if (fileUrl) {
                                actionButtonHtml = `<a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="btn-arrow" style="font-size: 12px; text-decoration: none;">Просмотр</a>`;
                            } else {
                                actionButtonHtml = `<button onclick="alert('Файл еще не прикреплен.')" class="btn-arrow btn-gray" style="font-size: 12px; cursor: pointer; border: none; padding: 8px 12px;">Нет файла</button>`;
                            }

                            innerHtml += `
                                    <div class="route-detail" style="font-size: 14px; margin-bottom: ${isLastItem ? '0' : '12px'}; border-bottom: ${isLastItem ? 'none' : '1px dashed rgba(113, 128, 150, 0.15)'}; padding-bottom: ${isLastItem ? '0' : '8px'}; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                        <span style="font-weight: bold; flex: 1; padding-right: 15px; text-align: left;">
                                            📋 ${doc.title}
                                        </span>
                                        ${actionButtonHtml}
                                    </div>
                                `;
                        });

                        card.innerHTML = innerHtml;
                        container.appendChild(card);
                    });
                });

            } catch (error) {
                console.error("Ошибка загрузки списков зачисленных:", error);
                document.getElementById('enrolled-container').innerHTML = '<div class="no-paid-msg">Не удалось загрузить списки зачисленных.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadEnrolledLists);
    </script>
    <script src="../../pages/monitoring/monitoring.js"></script>
</body>
</html>
