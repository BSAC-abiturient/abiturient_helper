<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {
            console.warn("Доступ к localStorage заблокирован:", e);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../Fon/avatar.jpeg" type="image/jpeg">
    <title>Абитуриентам после 9 класса — ССО</title>
    <link class="main-css" rel="stylesheet" href="../../css/main.css">

    <!-- React и Babel из CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <a href="sso_main.html" class="btn-back">← Назад</a>
            <h1>Абитуриентам после 9 класса</h1>
            <h2>Среднее специальное образование</h2>
        </header>

        <main id="react-calculator-root">
            <div class="academy-loader-container">
                <div class="cap-wrapper">
                    <svg class="mortarboard-svg" viewBox="0 0 64 64">
                        <path d="M16 32 V38 C16 43 23 46 32 46 C41 46 48 43 48 38 V32" fill="none" stroke="#007bff" stroke-width="3" stroke-linecap="round" />
                        <polygon points="32,10 58,22 32,34 6,22" fill="#007bff" stroke="#007bff" stroke-width="1" />
                        <path class="cap-tassel" d="M32,22 L46,27 V37" fill="none" stroke="#ff9800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="32" cy="22" r="2" fill="#ffffff" />
                    </svg>
                </div>
                <div class="loader-text">Загрузка данных...</div>
            </div>
        </main>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'http://localhost:1337/api/specialties';

        function Sso9Calculator() {
            const [score, setScore] = useState('');
            const [specialties, setSpecialties] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const res = await fetch(`${API_URL}?filters[education_level][$eq]=sso9&pagination[pageSize]=100`);
                        const json = await res.json();
                        const items = (json.data || []).map(item => ({
                            id: item.id,
                            ...(item.attributes || item)
                        }));
                        setSpecialties(items);
                        setLoading(false);
                    } catch (e) {
                        console.error("Ошибка загрузки данных sso9", e);
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            const handleScoreInput = (e) => {
                let val = e.target.value.replace(/[^0-9.,]/g, '').replace(',', '.');
                const dotIndex = val.indexOf('.');
                if (dotIndex !== -1) {
                    const integerPart = val.substring(0, dotIndex);
                    let fractionalPart = val.substring(dotIndex + 1).replace(/\./g, '');
                    if (fractionalPart.length > 1) {
                        fractionalPart = fractionalPart.substring(0, 1);
                    }
                    val = integerPart + '.' + fractionalPart;
                }
                const checkNum = parseFloat(val);
                if (!isNaN(checkNum) && checkNum > 10) {
                    val = '10';
                }
                setScore(val);
            };

            const clearSearch = () => {
                setScore('');
            };

            // Универсальный безопасный парсер JSON-распределения
            const parseDistribution = (dist) => {
                if (!dist) return [];
                let parsed = dist;
                if (typeof dist === 'string') {
                    try {
                        parsed = JSON.parse(dist);
                    } catch (e) {
                        return [];
                    }
                }
                return parsed.common || parsed || [];
            };

            const calculatePosition = (rawDistribution, userScore) => {
                const distribution = parseDistribution(rawDistribution);
                if (distribution.length === 0) return 1;

                const countAhead = distribution
                    .filter(app => app.score >= userScore)
                    .reduce((sum, app) => sum + app.count, 0);
                return countAhead + 1;
            };

            const userScore = parseFloat(score);
            const isValidScore = !isNaN(userScore) && userScore >= 1.0 && userScore <= 10.0;
            let results = [];

            if (isValidScore && specialties.length > 0) {
                const budgetSpecs = specialties.filter(s => s.category === 'budget');
                const paidSpecs = specialties.filter(s => s.category === 'paid');

                results = budgetSpecs.map(bSpec => {
                    const pSpec = paidSpecs.find(p => p.name === bSpec.name);

                    const bPos = calculatePosition(bSpec.applications_distribution, userScore);
                    const pPos = pSpec ? calculatePosition(pSpec.applications_distribution, userScore) : 0;

                    const budgetRatio = bSpec.plan > 0 ? (bPos / bSpec.plan) : Infinity;
                    const paidRatio = pSpec && pSpec.plan > 0 ? (pPos / pSpec.plan) : Infinity;
                    const bestRatio = Math.min(budgetRatio, paidRatio);

                    return {
                        name: bSpec.name,
                        url: `../monitoring/specialty.html?level=sso9&form=dnev&name=${encodeURIComponent(bSpec.name)}`,
                        budget: { position: bPos, plan: bSpec.plan },
                        paid: {
                            position: pPos,
                            plan: pSpec ? pSpec.plan : 0,
                            exists: !!pSpec
                        },
                        bestRatio: bestRatio
                    };
                });

                results.sort((a, b) => {
                    const aPassesBudget = a.budget.plan > 0 && a.budget.position <= a.budget.plan;
                    const bPassesBudget = b.budget.plan > 0 && b.budget.position <= b.budget.plan;

                    const aPassesPaid = a.paid.exists && a.paid.plan > 0 && a.paid.position <= a.paid.plan;
                    const bPassesPaid = b.paid.exists && b.paid.plan > 0 && b.paid.position <= b.paid.plan;

                    let aPriority = 3;
                    if (aPassesBudget) aPriority = 1;
                    else if (aPassesPaid) aPriority = 2;

                    let bPriority = 3;
                    if (bPassesBudget) bPriority = 1;
                    else if (bPassesPaid) bPriority = 2;

                    if (aPriority !== bPriority) return aPriority - bPriority;
                    return a.bestRatio - b.bestRatio;
                });
            }

            const getColorClass = (position, plan) => {
                if (position <= plan) {
                    if (position >= plan * 0.9) return 'text-yellow';
                    return 'text-green';
                }
                return 'text-red';
            };

            return (
                <div>
                    <div className="search-container">
                        <input
                            type="text"
                            className="score-search-input"
                            placeholder={loading ? "Загрузка данных..." : "Введите средний балл"}
                            value={score}
                            onChange={handleScoreInput}
                            disabled={loading}
                        />
                        {score && (
                            <span className="search-clear" style={{ display: 'block' }} onClick={clearSearch}>&times;</span>
                        )}
                    </div>

                    {score && (
                        <div className="search-results-box" style={{ display: 'block' }}>
                            {!isValidScore ? (
                                <div style={{ padding: '15px', textAlign: 'center', color: '#888' }}>
                                    Введите корректный балл от 1.0 до 10.0
                                </div>
                            ) : specialties.length === 0 ? (
                                <div style={{ padding: '15px', textAlign: 'center', color: '#ef5350', fontWeight: 'bold' }}>
                                    ⚠️ База данных пуста или недоступна. Запустите парсер:<br/>
                                    <a href="http://localhost:1337/api/specialties/parse" target="_blank" style={{color: '#007bff', textDecoration: 'underline'}}>
                                        http://localhost:1337/api/specialties/parse
                                    </a>
                                </div>
                            ) : (
                                results.map((spec, idx) => {
                                    const bClass = getColorClass(spec.budget.position, spec.budget.plan);
                                    let paidHtml = null;

                                    if (spec.paid.exists) {
                                        if (spec.paid.plan > 0) {
                                            const pClass = getColorClass(spec.paid.position, spec.paid.plan);
                                            paidHtml = (
                                                <div className="search-paid-line">
                                                    ваша позиция на платное: <span className={pClass}>{spec.paid.position} из {spec.paid.plan}</span>
                                                </div>
                                            );
                                        } else {
                                            paidHtml = <div className="search-paid-line">ваша позиция на платное: нет мест</div>;
                                        }
                                    } else {
                                        paidHtml = <div className="search-paid-line">ваша позиция на платное: прием не осуществляется</div>;
                                    }

                                    return (
                                        <a key={idx} href={spec.url} className="search-result-item">
                                            <div className="search-result-name">{spec.name}</div>
                                            <div className="search-result-info">
                                                <div className="search-budget-line">
                                                    ваша позиция на бюджет: <span className={bClass}>{spec.budget.position} из {spec.budget.plan}</span>
                                                </div>
                                                {paidHtml}
                                            </div>
                                        </a>
                                    );
                                })
                            )}
                        </div>
                    )}

                    {!score && (
                        <div class="btn-grid">
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Тестирование программного обеспечения" class="btn-item">Тестирование программного обеспечения<br/><span class="spec-duration">(3 года)</span></a>
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Разработка и сопровождение веб-ресурсов" class="btn-item">Разработка и сопровождение веб-ресурсов<br/><span class="spec-duration">(3 года 10 месяцев)</span></a>
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Техническая эксплуатация систем и сетей телекоммуникаций" class="btn-item">Техническая эксплуатация систем и сетей телекоммуникаций<br/><span class="spec-duration">(3 года 10 месяцев)</span></a>
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Информационные кабельные сети" class="btn-item">Информационные кабельные сети<br/><span class="spec-duration">(3 года 10 месяцев)</span></a>
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Техническая эксплуатация систем радиосвязи, радиовещания и телевидения" class="btn-item">Техническая эксплуатация систем радиосвязи, радиовещания и телевидения<br/><span class="spec-duration">(3 года 10 месяцев)</span></a>
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Техническая эксплуатация мультимедийных систем" class="btn-item">Техническая эксплуатация мультимедийных систем<br/><span class="spec-duration">(3 года 10 месяцев)</span></a>
                            <a href="../monitoring/specialty.html?level=sso9&form=dnev&name=Почтовая деятельность" class="btn-item">Почтовая деятельность<br/><span class="spec-duration">(3 года)</span></a>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-calculator-root'));
        root.render(<Sso9Calculator />);
    </script>

    <script src="../monitoring/monitoring.js"></script>
</body>
</html>
