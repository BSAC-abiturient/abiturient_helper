<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        } catch (e) {
            console.warn("Доступ к localStorage заблокирован:", e);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../Fon/avatar.jpeg" type="image/jpeg">
    <title>Абитуриентам после 11 класса — ССО</title>
    <link rel="stylesheet" href="../../css/main.css">

    <!-- React и Babel из CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <a href="sso_main.html" class="btn-back">← Назад</a>
            <h1>Абитуриентам после 11 класса</h1>
            <h2>Среднее специальное образование</h2>
        </header>

        <main id="react-calculator-root">
            <div class="academy-loader-container">
                <div class="cap-wrapper">
                    <svg class="mortarboard-svg" viewBox="0 0 64 64">
                        <path d="M16 32 V38 C16 43 23 46 32 46 C41 46 48 43 48 38 V32" fill="none" stroke="#007bff" stroke-width="3" stroke-linecap="round" />
                        <polygon points="32,10 58,22 32,34 6,22" fill="#007bff" stroke="#007bff" stroke-width="1" />
                        <path class="cap-tassel" d="M32,22 L46,27 V37" fill="none" stroke="#ff9800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="32" cy="22" r="2" fill="#ffffff" />
                    </svg>
                </div>
                <div class="loader-text">Загрузка данных...</div>
            </div>
        </main>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'https://narxselune-bsac-backend.hf.space/api/specialties';

        function Sso11Calculator() {
            const [score, setScore] = useState('');
            const [specialties, setSpecialties] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const res = await fetch(`${API_URL}?filters[education_level][$eq]=sso11&pagination[pageSize]=100`);
                        const json = await res.json();
                        const items = (json.data || []).map(item => ({
                            id: item.id,
                            ...(item.attributes || item)
                        }));
                        setSpecialties(items);
                        setLoading(false);
                    } catch (e) {
                        console.error("Ошибка загрузки данных sso11", e);
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            const handleScoreInput = (e) => {
                let val = e.target.value.replace(/[^0-9.,]/g, '').replace(',', '.');
                const dotIndex = val.indexOf('.');
                if (dotIndex !== -1) {
                    const integerPart = val.substring(0, dotIndex);
                    let fractionalPart = val.substring(dotIndex + 1).replace(/\./g, '');
                    if (fractionalPart.length > 1) {
                        fractionalPart = fractionalPart.substring(0, 1);
                    }
                    val = integerPart + '.' + fractionalPart;
                }
                const checkNum = parseFloat(val);
                if (!isNaN(checkNum) && checkNum > 10) {
                    val = '10';
                }
                setScore(val);
            };

            const clearSearch = () => {
                setScore('');
            };

            // Универсальный безопасный парсер JSON-распределения
            const parseDistribution = (dist) => {
                if (!dist) return [];
                let parsed = dist;
                if (typeof dist === 'string') {
                    try {
                        parsed = JSON.parse(dist);
                    } catch (e) {
                        return [];
                    }
                }
                return parsed.common || parsed || [];
            };

            const calculatePosition = (rawDistribution, userScore) => {
                const distribution = parseDistribution(rawDistribution);
                if (!Array.isArray(distribution) || distribution.length === 0) return 1;

                const countAhead = distribution
                    .filter(app => app.score >= userScore)
                    .reduce((sum, app) => sum + app.count, 0);
                return countAhead + 1;
            };

            const userScore = parseFloat(score);
            const isValidScore = !isNaN(userScore) && userScore >= 1.0 && userScore <= 10.0;
            let results = [];

            if (isValidScore && specialties.length > 0) {
                const budgetSpecs = specialties.filter(s => s.category === 'budget');
                const paidSpecs = specialties.filter(s => s.category === 'paid');

                results = budgetSpecs.map(bSpec => {
                    const pSpec = paidSpecs.find(p => p.name === bSpec.name && p.form_of_study === bSpec.form_of_study);

                    const bPos = bSpec ? calculatePosition(bSpec.applications_distribution, userScore) : 1;
                    const pPos = pSpec ? calculatePosition(pSpec.applications_distribution, userScore) : 1;

                    const bPlan = bSpec ? bSpec.plan : 0;
                    const pPlan = pSpec ? pSpec.plan : 0;

                    const budgetRatio = bPlan > 0 ? (bPos / bPlan) : Infinity;
                    const paidRatio = pPlan > 0 ? (pPos / pPlan) : Infinity;
                    const bestRatio = Math.min(budgetRatio, paidRatio);

                    return {
                        name: `${bSpec.name} (${bSpec.form_of_study === 'dnev' ? 'Дневное' : 'Заочное'})`,
                        url: `../monitoring/specialty.html?level=sso11&form=${bSpec.form_of_study}&name=${encodeURIComponent(bSpec.name)}`,
                        budget: { position: bPos, plan: bPlan },
                        paid: {
                            position: pPos,
                            plan: pPlan,
                            exists: !!pSpec
                        },
                        bestRatio: bestRatio
                    };
                });

                results.sort((a, b) => {
                    const aPassesBudget = a.budget.plan > 0 && a.budget.position <= a.budget.plan;
                    const bPassesBudget = b.budget.plan > 0 && b.budget.position <= b.budget.plan;

                    const aPassesPaid = a.paid.exists && a.paid.plan > 0 && a.paid.position <= a.paid.plan;
                    const bPassesPaid = b.paid.exists && b.paid.plan > 0 && b.paid.position <= b.paid.plan;

                    let aPriority = 3;
                    if (aPassesBudget) aPriority = 1;
                    else if (aPassesPaid) aPriority = 2;

                    let bPriority = 3;
                    if (bPassesBudget) bPriority = 1;
                    else if (bPassesPaid) bPriority = 2;

                    if (aPriority !== bPriority) return aPriority - bPriority;
                    return a.bestRatio - b.bestRatio;
                });
            }

            const getColorClass = (position, plan) => {
                if (position <= plan) {
                    if (position >= plan * 0.9) return 'text-yellow';
                    return 'text-green';
                }
                return 'text-red';
            };

            return (
                <div>
                    <div className="search-container">
                        <input
                            type="text"
                            className="score-search-input"
                            placeholder={loading ? "Загрузка..." : "Введите средний балл"}
                            value={score}
                            onChange={handleScoreInput}
                            disabled={loading}
                        />
                        {score && (
                            <span className="search-clear" style={{ display: 'block' }} onClick={clearSearch}>&times;</span>
                        )}
                    </div>

                    {score && (
                        <div className="search-results-box" style={{ display: 'block' }}>
                            {!isValidScore ? (
                                <div style={{ padding: '15px', textAlign: 'center', color: '#888' }}>
                                    Введите корректный балл от 1.0 до 10.0
                                </div>
                            ) : (
                                results.map((spec, idx) => {
                                    const bClass = getColorClass(spec.budget.position, spec.budget.plan);
                                    const pClass = getColorClass(spec.paid.position, spec.paid.plan);

                                    return (
                                        <a key={idx} href={spec.url} className="search-result-item">
                                            <div className="search-result-name">{spec.name}</div>
                                            <div className="search-result-info">
                                                <div className="search-budget-line">
                                                    ваша позиция на бюджет: {
                                                        spec.budget.plan > 0 ? (
                                                            <span className={bClass}>{spec.budget.position} из {spec.budget.plan}</span>
                                                        ) : (
                                                            <span style={{ color: '#a0aec0' }}>прием не осуществляется</span>
                                                        )
                                                    }
                                                </div>
                                                <div className="search-paid-line">
                                                    ваша позиция на платное: {
                                                        spec.paid.exists && spec.paid.plan > 0 ? (
                                                            <span className={pClass}>{spec.paid.position} из {spec.paid.plan}</span>
                                                        ) : (
                                                            <span style={{ color: '#a0aec0' }}>прием не осуществляется</span>
                                                        )
                                                    }
                                                </div>
                                            </div>
                                        </a>
                                    );
                                })
                            )}
                        </div>
                    )}

                    {!score && (
                        <div className="columns-container" id="default-columns">
                            <div className="column">
                                <h3>Дневная форма получения образования</h3>
                                <div className="btn-grid">
                                    <a href="../monitoring/specialty.html?level=sso11&form=dnev&name=Техническая эксплуатация систем и сетей телекоммуникаций" className="btn-item">Техническая эксплуатация систем и сетей телекоммуникаций<span className="spec-duration">(2 года 10 месяцев)</span></a>
                                    <a href="../monitoring/specialty.html?level=sso11&form=dnev&name=Техническая эксплуатация систем радиосвязи, радиовещания и телевидения" className="btn-item">Техническая эксплуатация систем радиосвязи, радиовещания и телевидения<span className="spec-duration">(2 года 10 месяцев)</span></a>
                                    <a href="../monitoring/specialty.html?level=sso11&form=dnev&name=Почтовая деятельность" className="btn-item">Почтовая деятельность<span className="spec-duration">(2 года)</span></a>
                                    <a href="../monitoring/specialty.html?level=sso11&form=dnev&name=Тестирование программного обеспечения" className="btn-item">Тестирование программного обеспечения<span className="spec-duration">(2 года)</span></a>
                                </div>
                            </div>
                            <div className="column">
                                <h3>Заочная форма получения образования</h3>
                                <div className="btn-grid">
                                    <a href="../monitoring/specialty.html?level=sso11&form=zaoch&name=Техническая эксплуатация систем и сетей телекоммуникаций" className="btn-item">Техническая эксплуатация систем и сетей телекоммуникаций<span className="spec-duration">(3 года 10 месяцев)</span></a>
                                    <a href="../monitoring/specialty.html?level=sso11&form=zaoch&name=Техническая эксплуатация систем радиосвязи, радиовещания и телевидения" className="btn-item">Техническая эксплуатация систем радиосвязи, радиовещания и телевидения<span className="spec-duration">(2 года 10 месяцев)</span></a>
                                    <a href="../monitoring/specialty.html?level=sso11&form=zaoch&name=Почтовая деятельность" className="btn-item">Почтовая деятельность<span className="spec-duration">(2 года)</span></a>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-calculator-root'));
        root.render(<Sso11Calculator />);
    </script>

    <script src="../monitoring/monitoring.js"></script>
</body>
</html>
